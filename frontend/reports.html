<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports & Analytics - MedTracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=6">
    <link rel="stylesheet" href="css/dashboard.css?v=1">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .report-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-container {
            background: var(--surface-solid);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 2rem;
            height: 400px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .summary-card {
            background: var(--surface-solid);
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .summary-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
        }

        .summary-card.success .summary-icon { background: rgba(16, 185, 129, 0.1); color: var(--green); }
        .summary-card.warning .summary-icon { background: rgba(239, 68, 68, 0.1); color: var(--red); }
        .summary-card.info .summary-icon { background: rgba(79, 70, 229, 0.1); color: var(--primary); }

        .summary-details h3 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--text-main);
        }

        .summary-details p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="#" class="sidebar-brand" style="text-decoration: none;">
                    <span class="title">MedTracker</span>
                    <span class="subtitle">Patient Portal</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i>📊</i>
                    <span>Dashboard</span>
                </a>
                <a href="medications.html" class="nav-item">
                    <i>💊</i>
                    <span>Medications</span>
                </a>
                <a href="schedule.html" class="nav-item">
                    <i>🗓️</i>
                    <span>Schedule</span>
                </a>
                <a href="reports.html" class="nav-item active">
                    <i>📈</i>
                    <span>Reports</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i>⚙️</i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="btn btn-primary btn-block" style="display: flex; gap: 0.5rem; background: var(--red);" id="logoutBtn">
                    <i>🚪</i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="report-header">
                <div>
                    <h1 style="font-size: 2rem; color: var(--text-main);">Adherence Analytics</h1>
                    <p style="color: var(--text-muted);">Visual tracking of your medication intake over time.</p>
                </div>
                <button class="btn btn-secondary">Download PDF Report</button>
            </div>

            <div class="summary-grid">
                <div class="summary-card success">
                    <div class="summary-icon">✓</div>
                    <div class="summary-details">
                        <h3>94%</h3>
                        <p>Overall Adherence</p>
                    </div>
                </div>
                <div class="summary-card warning">
                    <div class="summary-icon">!</div>
                    <div class="summary-details">
                        <h3>2</h3>
                        <p>Missed Doses (Month)</p>
                    </div>
                </div>
                <div class="summary-card info">
                    <div class="summary-icon">↻</div>
                    <div class="summary-details">
                        <h3>18 Days</h3>
                        <p>Current Streak</p>
                    </div>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="adherenceChart"></canvas>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Confirm Logout feature
            document.getElementById('logoutBtn')?.addEventListener('click', (e) => {
                e.preventDefault();
                if (confirm('Are you sure you want to log out?')) {
                    localStorage.removeItem('role');
                    window.location.href = 'login.html';
                }
            });

            // Handle Analytics Graph
            const ctx = document.getElementById('adherenceChart');
            if(ctx) {
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4', 'Week 5'],
                        datasets: [
                            {
                                label: 'Medications Taken',
                                data: [20, 21, 19, 21, 21],
                                borderColor: '#10B981', // Green
                                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                borderWidth: 3,
                                fill: true,
                                tension: 0.3
                            },
                            {
                                label: 'Medications Skipped',
                                data: [1, 0, 2, 0, 0],
                                borderColor: '#EF4444', // Red
                                backgroundColor: 'rgba(239, 68, 68, 0.1)',
                                borderWidth: 3,
                                fill: true,
                                tension: 0.3
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'top',
                            },
                            title: {
                                display: true,
                                text: 'Monthly Intake Overview',
                                font: {
                                    size: 16,
                                    family: 'Outfit'
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>

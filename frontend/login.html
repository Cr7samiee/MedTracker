<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MedTracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=5">
</head>

<body class="center-content">
    <div class="landing-container center-content">
        <div class="bg-shape shape-2" style="top: -100px; left: -100px; right: auto; bottom: auto;"></div>
        <div class="bg-shape shape-3" style="bottom: 10%; right: 10%; left: auto; top: auto;"></div>

        <nav class="navbar solid-nav">
            <div class="nav-left" style="flex: 1;">
                <a href="index.html" class="glass-back-btn">
                    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg> Home
                </a>
            </div>
            <a href="index.html" class="logo"
                style="text-decoration:none; flex: 0; white-space: nowrap; display: flex; justify-content: center;">
                <span class="logo-icon">💊</span>
                <span class="logo-text">MedTracker</span>
            </a>
            <div class="nav-right" style="flex: 1; display: flex; justify-content: flex-end;">
                <a href="#" class="nav-support-btn">Help & Support</a>
            </div>
        </nav>

        <main class="auth-wrapper fade-in-up">
            <div class="glass-card auth-card">
                <div class="text-center mb-4">
                    <h2>Welcome <span class="highlight">Back</span></h2>
                    <p>Enter your details to access your account.</p>
                </div>

                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" required placeholder="e.g. 1234567890">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" required placeholder="••••••••">
                            <button type="button" class="password-toggle">👁️</button>
                        </div>
                    </div>

                    <div class="form-options mb-4">
                        <label class="remember-me">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="forgot_password.html" class="text-primary text-sm">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log In</button>
                    <div id="loginMessage" class="form-message"></div>
                </form>

                <div class="auth-footer mt-4 text-center">
                    Don't have an account? <a href="role_selection.html" class="text-primary font-bold">Sign up</a>
                </div>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="main-footer">
        <div class="footer-content">
            <div class="footer-brand">
                <div class="footer-logo">
                    <span class="logo-icon">💊</span>
                    <span class="logo-text">MedTracker</span>
                </div>
                <p class="footer-tagline">Reminders, inventory, and care coordination in one calm, simple place.</p>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 MedTracker. Your smart companion for medication and health.</p>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>

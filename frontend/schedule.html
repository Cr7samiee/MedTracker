<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Schedule - MedTracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=6">
    <link rel="stylesheet" href="css/dashboard.css?v=1">
    <style>
        .schedule-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
        }

        .schedule-item {
            background: var(--surface-solid);
            padding: 1.5rem;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            border-left: 5px solid var(--primary);
            transition: all 0.2s ease;
        }

        .schedule-item.taken {
            border-left-color: var(--green);
            opacity: 0.7;
        }

        .schedule-item.skipped {
            border-left-color: var(--red);
            opacity: 0.7;
        }

        .schedule-time {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            min-width: 100px;
        }
        
        .schedule-details {
            flex-grow: 1;
            margin-left: 2rem;
        }

        .schedule-details h4 {
            font-size: 1.25rem;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .schedule-details p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin: 0;
        }

        .action-buttons {
            display: flex;
            gap: 0.75rem;
        }

        .btn-taken {
            background: rgba(16, 185, 129, 0.1);
            color: var(--green);
            border: 1px solid var(--green);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-taken:hover {
            background: var(--green);
            color: white;
        }

        .btn-skipped {
            background: rgba(239, 68, 68, 0.1);
            color: var(--red);
            border: 1px solid var(--red);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-skipped:hover {
            background: var(--red);
            color: white;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.875rem;
            display: none;
        }

        .status-badge.taken { background: rgba(16, 185, 129, 0.1); color: var(--green); display: inline-block; }
        .status-badge.skipped { background: rgba(239, 68, 68, 0.1); color: var(--red); display: inline-block; }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="#" class="sidebar-brand" style="text-decoration: none;">
                    <span class="title">MedTracker</span>
                    <span class="subtitle">Patient Portal</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i>📊</i>
                    <span>Dashboard</span>
                </a>
                <a href="medications.html" class="nav-item">
                    <i>💊</i>
                    <span>Medications</span>
                </a>
                <a href="schedule.html" class="nav-item active">
                    <i>🗓️</i>
                    <span>Schedule</span>
                </a>
                <a href="reports.html" class="nav-item">
                    <i>📈</i>
                    <span>Reports</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i>⚙️</i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="btn btn-primary btn-block" style="display: flex; gap: 0.5rem; background: var(--red);" id="logoutBtn">
                    <i>🚪</i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="top-bar" style="margin-bottom: 2rem;">
                <div>
                    <h1 style="font-size: 2rem; color: var(--text-main);">Today's Schedule</h1>
                    <p style="color: var(--text-muted);">Mark your medications as taken or skipped to maintain your adherence score.</p>
                </div>
                <div style="background:#F1F5F9; padding:0.5rem 1rem; border-radius:999px; font-weight:600;">
                    🗓️ Oct 24, 2026
                </div>
            </div>

            <div class="schedule-grid" id="scheduleGrid">
                <!-- Dynamically populated from DB -->
                <p style="text-align:center; color: var(--text-muted); font-style:italic;">Loading schedule from database...</p>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('logoutBtn')?.addEventListener('click', (e) => {
                e.preventDefault();
                if (confirm('Are you sure you want to log out?')) {
                    localStorage.removeItem('role');
                    window.location.href = 'login.html';
                }
            });

            fetchSchedule();
        });

        async function fetchSchedule() {
            // Assume test_patient for prototype or fetch from localstorage
            const res = await fetch('../backend/api/get_schedule.php?role=User&user_id=test_patient');
            const data = await res.json();
            const grid = document.getElementById('scheduleGrid');
            grid.innerHTML = '';

            if (data.success && data.data.length > 0) {
                data.data.forEach((med, index) => {
                    const status = med.status || 'Pending';
                    const timeDisp = med.scheduled_time ? new Date(med.scheduled_time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Anytime';
                    
                    let actionHtml = '';
                    let badgeHtml = '';
                    let extraClass = '';
                    let outOfStockAlert = '';

                    // Check stock
                    if (med.stock_remaining <= 0) {
                        outOfStockAlert = `
                            <div style="color:var(--red); font-size:0.8rem; font-weight:bold; margin-top:0.5rem;">
                                ⚠️ Finished! Doctor recommends taking it. 
                                <button onclick="restockManual(${med.medicine_id})" style="background:var(--primary); color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; margin-left:0.5rem;">Restock</button>
                            </div>
                        `;
                    }

                    if (status === 'Taken') {
                        extraClass = 'taken';
                        badgeHtml = `<div class="status-badge taken" style="display:inline-block;">✓ Taken</div>`;
                    } else if (status === 'Skipped') {
                        extraClass = 'skipped';
                        badgeHtml = `<div class="status-badge skipped" style="display:inline-block;">✗ Skipped</div>`;
                    } else {
                        actionHtml = `
                            <button class="btn-taken" onclick="updateStatus(${med.medicine_id}, 'Taken')">✓ Taken</button>
                            <button class="btn-skipped" onclick="updateStatus(${med.medicine_id}, 'Skipped')">✗ Skipped</button>
                        `;
                    }

                    grid.innerHTML += `
                        <div class="schedule-item ${extraClass}" id="item-${med.medicine_id}">
                            <div class="schedule-time">${timeDisp}</div>
                            <div class="schedule-details">
                                <h4>${med.medicine_name} <span>💊</span></h4>
                                <p>${med.dosage} • ${med.instructions} • <span style="font-size:0.75rem; color:#888;">Remaining: ${med.stock_remaining}</span></p>
                                ${outOfStockAlert}
                            </div>
                            <div class="action-buttons" id="actions-${med.medicine_id}">
                                ${actionHtml}
                            </div>
                            ${badgeHtml}
                        </div>
                    `;
                });
            } else {
                grid.innerHTML = '<p style="text-align:center;">No medications scheduled for today.</p>';
            }
        }

        async function updateStatus(medicineId, status) {
            if (status === 'Skipped') {
                if(!confirm("Are you sure you want to skip this medication? This will drop your adherence score.")) return;
            }

            try {
                const res = await fetch('../backend/api/log_intake.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        patient_id: 'test_patient', 
                        medicine_id: medicineId,
                        status: status
                    })
                });
                const data = await res.json();
                
                if (data.success) {
                    fetchSchedule(); // Refresh layout
                } else {
                    alert('Could not update: ' + data.message);
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function restockManual(medicineId) {
            const stock = prompt("How many pills/units did you refill?", "30");
            if (!stock || isNaN(stock) || parseInt(stock) <= 0) return;

            try {
                const res = await fetch('../backend/api/update_stock.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        medicine_id: medicineId,
                        added_stock: parseInt(stock)
                    })
                });
                const data = await res.json();
                if (data.success) {
                    alert("Stock updated!");
                    fetchSchedule();
                } else {
                    alert("Failed to restock: " + data.message);
                }
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>

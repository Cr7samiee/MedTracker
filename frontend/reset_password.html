<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MedTracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=5">
</head>

<body class="center-content">
    <div class="landing-container center-content">
        <nav class="navbar solid-nav">
            <div class="nav-left" style="flex: 1;">
                <a href="index.html" class="glass-back-btn">
                    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg> Home
                </a>
            </div>
            <a href="index.html" class="logo" style="text-decoration:none; flex: 0; white-space: nowrap; display: flex; justify-content: center;">
                <span class="logo-icon">💊</span>
                <span class="logo-text">MedTracker</span>
            </a>
            <div class="nav-right" style="flex: 1; display: flex; justify-content: flex-end;">
                <a href="javascript:void(0)" class="nav-support-btn">Help & Support</a>
            </div>
        </nav>

        <main class="auth-wrapper fade-in-up">
            <div class="glass-card auth-card">
                <div class="text-center mb-4">
                    <h2>Reset <span class="highlight">Password</span></h2>
                    <p>Enter the OTP sent to your phone and pick a new password.</p>
                </div>

                <form id="resetPasswordForm" class="auth-form">
                    <!-- Readonly phone from URL or local storage -->
                    <div class="form-group">
                        <label for="reset-phone">Phone Number</label>
                        <input type="tel" id="reset-phone" name="phone" required readonly class="readonly-input">
                    </div>

                    <div class="form-group">
                        <label for="otp">6-Digit OTP</label>
                        <input type="text" id="otp" name="otp" required placeholder="123456" maxlength="6"
                            class="text-center tracking-widest text-lg">
                    </div>

                    <div class="form-group">
                        <label for="new_password">New Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="new_password" name="new_password" required
                                placeholder="••••••••">
                            <button type="button" class="password-toggle">👁️</button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block mt-4" id="resetBtn">Reset Password</button>
                    <div id="resetMessage" class="form-message"></div>
                </form>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="main-footer">
        <div class="footer-content">
            <div class="footer-brand">
                <div class="footer-logo">
                    <span class="logo-icon">💊</span>
                    <span class="logo-text">MedTracker</span>
                </div>
                <p class="footer-tagline">Reminders, inventory, and care coordination in one calm, simple place.</p>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 MedTracker. Your smart companion for medication and health.</p>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
<!-- DYNAMIC_NAME_SCRIPT -->
<script>
            document.addEventListener('DOMContentLoaded', () => {
                const userName = localStorage.getItem('name') || 'User';
                document.querySelectorAll('.dynamic-user-name').forEach(el => el.textContent = userName);
                // Also fix generic profiles
                const profileNames = document.querySelectorAll('.name, .user-profile-sm .info .name');
                profileNames.forEach(el => {
                    if(el.textContent.includes('User') || el.textContent.includes('David') || el.textContent.includes('Patient Portal') || el.textContent.includes('Sarah')) {
                        el.textContent = userName;
                    }
                });
            });
        </script>
</body>

</html>

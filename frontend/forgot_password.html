<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - MedTracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="landing-container center-content">
        <nav class="navbar solid-nav">
            <a href="index.html" class="logo" style="text-decoration:none;">
                <span class="logo-icon">💊</span>
                <span class="logo-text">MedTracker</span>
            </a>
        </nav>

        <main class="auth-wrapper fade-in-up">
            <div class="glass-card auth-card text-center">
                <h2>Forgot <span class="highlight">Password?</span></h2>
                <p class="mb-4">Enter your phone number and we’ll send you a 6-digit OTP to reset your password.</p>

                <form id="forgotPasswordForm" class="auth-form text-left">
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="forgot-phone" name="phone" required placeholder="1234567890">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="forgotBtn">Send OTP</button>
                    <div id="forgotMessage" class="form-message mt-2"></div>
                </form>

                <div class="auth-footer mt-4">
                    Remember your password? <a href="login.html" class="text-primary font-bold">Log in</a>
                </div>
            </div>
        </main>
    </div>

    <script src="js/script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Role - MedTracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="center-content">
    <div class="landing-container center-content">
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>

        <nav class="navbar solid-nav">
            <a href="index.html" class="logo" style="text-decoration:none;">
                <span class="logo-icon">💊</span>
                <span class="logo-text">MedTracker</span>
            </a>
        </nav>

        <main class="auth-wrapper fade-in-up">
            <div class="glass-card auth-card text-center">
                <h2>Join <span class="highlight">MedTracker</span></h2>
                <p class="mb-4">Select your role to continue</p>

                <div class="role-grid">
                    <a href="signup.html?role=User" class="role-card">
                        <div class="role-icon">👤</div>
                        <div class="role-info text-left">
                            <h3>Patient / User</h3>
                            <p>Track your meds & health</p>
                        </div>
                    </a>
                    <a href="signup.html?role=Health Worker" class="role-card">
                        <div class="role-icon">⚕️</div>
                        <div class="role-info text-left">
                            <h3>Health Worker</h3>
                            <p>Manage patients & prescriptions</p>
                        </div>
                    </a>
                    <a href="signup.html?role=Admin" class="role-card">
                        <div class="role-icon">🛡️</div>
                        <div class="role-info text-left">
                            <h3>Administrator</h3>
                            <p>System oversight & management</p>
                        </div>
                    </a>
                </div>

                <div class="auth-footer mt-4">
                    Already have an account? <a href="login.html" class="text-primary font-bold">Log in</a>
                </div>
            </div>
        </main>
    </div>
</body>

</html>

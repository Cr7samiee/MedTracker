name: medtracker2

services:
  app:
    build:
      context: ..
      dockerfile: services/Dockerfile
    container_name: medtracker_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-medtracker_db}
      DB_USER: ${DB_USER:-medtracker_user}
      DB_PASS: ${DB_PASS:-medtracker_password}
      DB_FALLBACK_HOST: mysql
      DB_FALLBACK_PORT: 3306
      DB_FALLBACK_USER: ${DB_USER:-medtracker_user}
      DB_FALLBACK_PASS: ${DB_PASS:-medtracker_password}
      DB_FALLBACK_NAME: ${DB_NAME:-medtracker_db}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ../:/var/www/html

  mysql:
    image: mysql:8.4
    container_name: medtracker_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-medtracker_root_password}
      MYSQL_DATABASE: ${DB_NAME:-medtracker_db}
      MYSQL_USER: ${DB_USER:-medtracker_user}
      MYSQL_PASSWORD: ${DB_PASS:-medtracker_password}
      TZ: Asia/Kathmandu
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - medtracker_mysql_data:/var/lib/mysql
      - ../backend/db/database.sql:/docker-entrypoint-initdb.d/01_database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER:-medtracker_user}", "-p${DB_PASS:-medtracker_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    container_name: medtracker_phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-medtracker_user}
      PMA_PASSWORD: ${DB_PASS:-medtracker_password}
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"

volumes:
  medtracker_mysql_data:
